  - {ends: [pplug.POWER.GND, chute.servo.GND], wire: ul3135-silicone, awg: 22, route: chute servo, harness: p}
  - {ends: [p_diodes.pads.VOUT, p_3v3.J1.VIN], wire: thin-signal-lead, awg: 28, length_mm: 20, harness: p}
  - {ends: [pplug.POWER.GND, p_3v3.J1.GND], wire: thin-signal-lead, awg: 28, length_mm: 30, harness: p}
  - {ends: [p_3v3.J1.VOUT, p_switch.U1.VCC], wire: thin-signal-lead, awg: 28, length_mm: 15, harness: p}
  - {ends: [p_3v3.J1.GND, p_switch.U1.GND], wire: thin-signal-lead, awg: 28, length_mm: 15, harness: p}
  - {ends: [pplug.SIGNAL.CAN_P, p_node.CAN1.CAN_P], wire: thin-signal-lead, awg: 26, length_mm: 50, harness: p}
  - {ends: [pplug.SIGNAL.CAN_N, p_node.CAN1.CAN_N], wire: thin-signal-lead, awg: 26, length_mm: 50, harness: p}
  - {ends: [pplug.SIGNAL.CAN_5V, p_node.CAN1.5V], wire: thin-signal-lead, awg: 26, length_mm: 50, harness: p}
  - {ends: [pplug.SIGNAL.GND, p_node.CAN1.GND], wire: thin-signal-lead, awg: 26, length_mm: 50, harness: p}
  - {ends: [p_node.PWM.PWM1, p_switch.U1.I0], wire: thin-signal-lead, awg: 28, length_mm: 50, harness: p}
  - {ends: [pplug.SIGNAL.CHUTE, p_switch.U1.I1], wire: thin-signal-lead, awg: 28, length_mm: 40, harness: p}
  - {ends: [pplug.SIGNAL.TAKEOVER, p_switch.U1.S], wire: thin-signal-lead, awg: 28, length_mm: 40, harness: p}
  - {ends: [p_switch.U1.Y, chute.servo.SIG], wire: thin-signal-lead, awg: 28, route: chute servo, harness: p}

  # C: two servos on the module supply, driven by C's CAN node
  - {ends: [cplug.POWER.5V, claws.servo1.V+], wire: ul3135-silicone, awg: 20, route: claws, harness: c}
  - {ends: [cplug.POWER.5V, claws.servo2.V+], wire: ul3135-silicone, awg: 20, route: claws, harness: c}
  - {ends: [cplug.POWER.GND, claws.servo1.GND], wire: ul3135-silicone, awg: 20, route: claws, harness: c}
  - {ends: [cplug.POWER.GND, claws.servo2.GND], wire: ul3135-silicone, awg: 20, route: claws, harness: c}
  - {ends: [cplug.SIGNAL.CAN_P, c_node.CAN1.CAN_P], wire: thin-signal-lead, awg: 26, length_mm: 60, harness: c}
  - {ends: [cplug.SIGNAL.CAN_N, c_node.CAN1.CAN_N], wire: thin-signal-lead, awg: 26, length_mm: 60, harness: c}
  - {ends: [cplug.SIGNAL.CAN_5V, c_node.CAN1.5V], wire: thin-signal-lead, awg: 26, length_mm: 60, harness: c}
  - {ends: [cplug.SIGNAL.GND, c_node.CAN1.GND], wire: thin-signal-lead, awg: 26, length_mm: 60, harness: c}
  - {ends: [c_node.PWM.PWM1, claws.servo1.SIG], wire: thin-signal-lead, awg: 28, route: claws, harness: c}
  - {ends: [c_node.PWM.PWM2, claws.servo2.SIG], wire: thin-signal-lead, awg: 28, route: claws, harness: c}

# No cell fuse links (decided 2026-10-18, in the build). The checks showed no gauge both
# survives flat-out flight and opens a dead short before the battery leads' insulation burns:
# the pack can only push about five times the current cap into a short. The leads are kept
# short, sleeved and routed away from crush points instead.

# What this design knowingly doesn't cover; it goes in the report's unproven list.
unproven:
  - "A dead short in the battery leads. Nothing electrical stops it; only the leads' routing and sleeving protect against it."
  - "The motor cut board's two undocumented 1 kOhm resistors. Check them with a meter; pull-ups would make the board fail the wrong way, which the added pull-down only partly covers."
  - "Powering the Pi 5 through its GPIO 5 V pins, which Raspberry Pi's docs don't describe."
  - "The Pi 5's highest safe input. Raspberry Pi publishes only a 5.1 V supply and the 4.63 V undervoltage warning, so its 5.19 V from the BEC is checked against USB's 5.25 V ceiling, with no margin."
  - "The ESC cable's re-pinning: Holybro doesn't say which end of its plug is pin 1."
  - "Whether the ARK FPV terminates its CAN port. If it does, the harness's terminator at that end comes off."

# The check numbers, from the spec's "The check numbers" (2026-10-18)
checks:
  continuous_share: 0.8 # every wire, connector, fuse and supply at no more than 80% of its rating
  burst_s: 10 # a burst at the current cap, for the heat check
  air_c: 40 # a hot day, inside the frame
  temp_margin_c: 20 # every part this far under its rated maximum
  main_drop_share: 0.02 # of the pack's nominal voltage, lost between pack and ESC at the cap
  load_margin_v: 0.1 # every load this far inside its voltage range, at both ends
  pin_minimums:
    pi.GPIO.5V: 4.75 # the Pi's undervoltage warning (4.63 V) plus about 0.1 V
  pin_ceilings:
    pi.GPIO.5V: 5.25 # USB's 5 V ceiling, with no margin: Raspberry Pi publishes no maximum (2026-10-19)
  supply_typical_share: 0.8 # typical draw against a supply's continuous rating
  fuse_hold_factor: 1.25 # a fuse holds this times its branch's highest steady current
  cell_link_blow_s: 1.0 # a dead short melts a cell link this fast
  backups: [bec.5V] # with the module supply dead, the safety monitor and the chute have to carry on
  rise_share: 0.1 # signal edges, as a share of a bit
  threshold_margin_share: 0.1 # of the supply, past each logic threshold
