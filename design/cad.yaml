# The CAD's design inputs (from the CAD talk, 2026-10-17). These numbers are mine, not a
# maker's, so each says why. Coordinates are in mm, in the frame's frame: the origin is the
# center of the motors at the underside of the bottom plate, x points to the nose, y to the
# left, z up. The frame's stack-up: bottom plate 0-3, arms 3-10, middle plate 10-13, the
# stack bay 13-32, top plate 32-35. Props spin at about z = 43-52.

materials:
  tpu:
    density_g_cm3: 1.21
    fill: 0.6
    note: TPU 95A, for parts that take hits (legs, the GPS mast mount). The fill is walls plus infill, as a share of solid
  petg_cf:
    density_g_cm3: 1.30
    fill: 0.5
    note: Carbon-filled PETG, stiff and light, for brackets, the tray and the rail
  carbon:
    density_g_cm3: 1.6
    fill: 1.0
    note: Carbon fiber plate and tube, solid

print:
  min_wall_mm: 1.2 # three 0.4 mm perimeters, the thinnest wall worth printing

checks: # from the spec's "check numbers"
  max_motor_overload: 0.05 # in a hover, no motor works more than 5% harder than the average
  rigid_clearance_mm: 10 # props flex and motors vibrate
  moving_clearance_mm: 20 # antennas, wires and straps can swing
  chute_cone_half_angle_deg: 30
  chute_cone_height_mm: 500
  compass_from_power_mm: 100 # Matek: keep the compass 10 cm from power wires, the ESC and motors
  remote_id_from_gps_mm: 100 # Ruko says "away from the GPS"; 10 cm is my reading of that

pack:
  tray_max_length_mm: 150 # the pack hangs under the body, between the legs
  tray_max_width_mm: 90
  x_mm: 30 # the pack's center, before trimming
  slide_mm: 30 # how far it can slide either way to trim the balance
  tray_thickness_mm: 3

legs:
  spots_mm: [[45, 45], [45, -45], [-45, 45], [-45, -45]] # under the arms, outside the pack
  diameter_mm: 12
  below_pack_mm: 20 # the legs reach this far below the pack, so the pack never lands
  material: tpu

rail: # the module rail on the top plate, carrying V and P
  from_x_mm: -52
  to_x_mm: 66
  width_mm: 30
  height_mm: 6
  material: petg_cf

gps_mast:
  at_mm: [-58, 0] # on the top plate, behind the V housing
  height_mm: 90
  tube_diameter_mm: 8
  mount_size_mm: 14 # the printed TPU block the tube plugs into
  material: carbon

v_housing: # an envelope around the Pi 5 stack, until the modules step designs it
  from_x_mm: -50
  to_x_mm: 12 # 58 mm inside, for the 56.5 mm HaLow HAT
  width_mm: 92
  height_mm: 69
  wall_mm: 2
  material: petg_cf

p_holder: # a cradle around the Harrier tube's base
  height_mm: 30
  wall_mm: 2
  material: petg_cf

# Where each bought part sits: its own origin (centered, sitting on z = 0) moved to at_mm,
# after turning by turn_deg about x, then y, then z.
place:
  holybro-tekko32-f4-50a: {at_mm: [0, 0, 13.9]} # on the middle plate, its underside parts at 13.0
  holybro-kakute-h7: {at_mm: [0, 0, 22.8]} # 2 mm above the ESC; its top at 28.4, under the 32 mm top plate
  radiomaster-rp2-v2: {at_mm: [-56, 0, 13]} # at the rear edge of the bay, its ceramic antenna at the back
  pjrc-teensy-41: {at_mm: [62, 0, 17.5]} # in front of the stack, on its printed carrier
  safety-monitor-extras: {at_mm: [110, 0, 13]}
  ruko-r111: {at_mm: [95, 0, 35]} # on the front of the top plate, away from the GPS and the belly
  benewake-tf-luna: {at_mm: [125, 0, -3], turn_deg: [180, 0, 0]} # under the nose, looking down
  rpi-camera-module-3: {at_mm: [162, 0, 17.5], turn_deg: [0, 90, 0]} # in front of the plates, looking forward
  matek-m10q-5883: {at_mm: [-58, 0, 125]} # on top of the GPS mast
  rpi-5-4gb: {at_mm: [-19, 0, 45], turn_deg: [0, 0, 90]} # inside the V housing, its long side across
  rpi-active-cooler: {at_mm: [-19, 0, 62.4], turn_deg: [0, 0, 90]} # drawn above the Pi's envelope, which is conservative
  heltec-ht-hc01p: {at_mm: [-19, 0, 84.6], turn_deg: [0, 0, 90]} # on a stacking header above the cooler
  matek-bec12s-pro: {at_mm: [-19, 0, 94.2]}
  halow-antenna-915: {at_mm: [-50, 35, 95], turn_deg: [0, -90, 0]} # out the back of the V housing, high and to the left
  fruity-chutes-harrier-40-42: {at_mm: [38, 0, 41]} # standing on the rail, just ahead of the center
  claws-placeholder: {at_mm: [-100, 0, -53]} # behind the pack, hanging from the back of the bottom plate

# Rough wire routes: a tube about the thickness of each run's likely gauge, through these
# points. Step 3 picks the real gauges and connectors and sends back exact thicknesses.
wires:
  - name: battery leads
    diameter_mm: 8 # two 12 AWG leads side by side
    path_mm: [[30, 0, -5], [-60, 0, -5], [-70, 0, 5], [-70, 0, 16], [-26, 0, 16]]
  - name: motor leads front left
    diameter_mm: 5 # three 18 AWG
    path_mm: [[20, 15, 16], [30, 30, 12], [130, 130, 12], [146, 146, 12]]
  - name: motor leads front right
    diameter_mm: 5
    path_mm: [[20, -15, 16], [30, -30, 12], [130, -130, 12], [146, -146, 12]]
  - name: motor leads back left
    diameter_mm: 5
    path_mm: [[-20, 15, 16], [-30, 30, 12], [-130, 130, 12], [-146, 146, 12]]
  - name: motor leads back right
    diameter_mm: 5
    path_mm: [[-20, -15, 16], [-30, -30, 12], [-130, -130, 12], [-146, -146, 12]]
  - name: receiver
    diameter_mm: 3
    path_mm: [[-10, 0, 25], [-50, 0, 18]]
  - name: gps
    diameter_mm: 3
    path_mm: [[-10, 5, 28], [-55, 5, 30], [-55, 5, 40], [-55, 5, 122]]
  - name: lidar
    diameter_mm: 3
    path_mm: [[10, 0, 24], [118, 8, 16], [140, 8, 8], [140, 8, -6]]
  - name: safety monitor
    diameter_mm: 3
    path_mm: [[15, 0, 26], [35, 0, 24]]
  - name: bec feed
    diameter_mm: 3
    path_mm: [[-70, 6, 10], [-66, 6, 38], [-40, 30, 45], [-30, 30, 94]]
  - name: module connector
    diameter_mm: 4
    path_mm: [[-5, 0, 29], [-5, 0, 41]]
  - name: camera cable
    diameter_mm: 3
    path_mm: [[158, 0, 17.5], [150, 0, 38], [12, 0, 44], [-5, 0, 52]]
  - name: chute servo
    diameter_mm: 3
    path_mm: [[0, 8, 29], [8, 8, 38], [11, 0, 44]]
