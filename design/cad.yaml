    module: C
    diameter_mm: 6.0 # from the electrical connection list
    path_mm: [[-90.5, 11.3, 5], [-110, 10, 2], [-125, 0, -3]] # from its plugs
  - name: esc cable from switch
    diameter_mm: 2.3 # from the electrical connection list
    path_mm: [[57.9, 7.6, 24.2], [30, -12, 24], [30.5, -2.1, 17.5]] # from its plugs

# The screws, nuts and spacers, counted from the CAD's holes: the printed parts' screw holes in
# pcs14.cad.printed and the boards' mounting holes in the catalog. Steel where the joint carries
# load (the legs take the landings, the tray holds the pack, the stack takes the motors'
# vibration, the chute's base takes its opening shock), nylon where it holds only a light part.
# The GPS's tape and the modules' rail locks were added 2026-10-20 (rail.locks_mm and the GPS
# mast's cradle). Decided 2026-10-19.
hardware:
  - {what: screw, size: M3, length_mm: 12, count: 8, material: steel, holds: landing-legs, note: "two through each leg's flange and its arm"}
  - {what: lock nut, size: M3, count: 8, material: steel, holds: landing-legs}
  - {what: screw, size: M3, length_mm: 8, count: 4, material: steel, holds: battery-tray, note: "the tray to the bottom plate"}
  - {what: lock nut, size: M3, count: 4, material: steel, holds: battery-tray}
  - {what: screw, size: M3, length_mm: 30, count: 4, material: steel, holds: holybro-tekko32-f4-50a, note: "the stack, through the plate, the ESC and the flight controller"}
  - {what: lock nut, size: M3, count: 4, material: steel, holds: holybro-tekko32-f4-50a}
  - {what: spacer, size: M3, length_mm: 6, count: 4, material: nylon, holds: holybro-tekko32-f4-50a, note: "between the ESC and the flight controller"}
  - {what: grommet, count: 8, grams: 0.15, holds: holybro-tekko32-f4-50a, note: "silicone soft mounts for the ESC's 4 mm holes, a guess from their size"}
  - {what: screw, size: M3, length_mm: 10, count: 4, material: nylon, holds: module-mount, note: "the rail to the top plate"}
  - {what: insert, count: 3, grams: 0.4, holds: module-mount, note: "M3 brass heat-set inserts in the rail, for the modules' locks; 0.4 g is a typical 4 x 5.7 mm insert"}
  - {what: screw, size: M3, length_mm: 10, count: 1, material: steel, holds: v-housing, note: "V's rail lock, a thumb screw into the rail's insert"}
  - {what: screw, size: M3, length_mm: 12, count: 2, material: steel, holds: p-mount, note: "P's rail locks, two for the chute's opening shock"}
  - {what: tape, count: 4, grams: 0.22, holds: ark-gps, note: "15 x 15 mm pads of 1 mm acrylic foam tape (VHB-style, about 0.96 g per cubic cm), the GPS to its cradle"}
  - {what: screw, size: M3, length_mm: 10, count: 2, material: steel, holds: claws-placeholder, note: "C's lock, through the claws' mount and the bottom plate"}
  - {what: lock nut, size: M3, count: 2, material: steel, holds: claws-placeholder}
  - {what: nut, size: M3, count: 4, material: nylon, holds: module-mount}
  - {what: screw, size: M3, length_mm: 8, count: 2, material: nylon, holds: lidar-bracket}
  - {what: nut, size: M3, count: 2, material: nylon, holds: lidar-bracket}
  - {what: screw, size: M2, length_mm: 6, count: 2, material: nylon, holds: benewake-tf-luna, note: "by its two ears"}
  - {what: nut, size: M2, count: 2, material: nylon, holds: benewake-tf-luna}
  - {what: screw, size: M3, length_mm: 8, count: 2, material: nylon, holds: safety-monitor-carrier}
  - {what: nut, size: M3, count: 2, material: nylon, holds: safety-monitor-carrier}
  - {what: patch, count: 1, grams: 0.5, holds: ruko-r111, note: "hook-and-loop under the Remote ID, a guess"}
  - {what: screw, size: M3, length_mm: 8, count: 2, material: nylon, holds: camera-bracket, note: "the tab to the top plate's nose"}
  - {what: nut, size: M3, count: 2, material: nylon, holds: camera-bracket}
  - {what: screw, size: M2, length_mm: 8, count: 4, material: nylon, holds: rpi-camera-module-3}
  - {what: nut, size: M2, count: 4, material: nylon, holds: rpi-camera-module-3}
  - {what: standoff, size: M2.5, length_mm: 6, count: 4, material: nylon, holds: rpi-5-4gb, note: "raising the Pi 6 mm off the housing's floor for the module plug"}
  - {what: screw, size: M2.5, length_mm: 6, count: 4, material: nylon, holds: rpi-5-4gb}
  - {what: standoff, size: M2.5, length_mm: 11, count: 4, material: nylon, holds: heltec-ht-hc01p, note: "the usual height for a HAT on a Pi"}
  - {what: screw, size: M2.5, length_mm: 6, count: 4, material: nylon, holds: heltec-ht-hc01p}
  - {what: screw, size: 4-40, length_mm: 6.35, count: 3, material: steel, holds: fruity-chutes-harrier-40-42, note: "the three holes in the Harrier's base"}
