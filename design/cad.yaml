# The CAD's design inputs (from the CAD talk, 2026-10-17). These numbers are mine, not a
# maker's, so each says why. Coordinates are in mm, in the frame's frame: the origin is the
# center of the motors at the underside of the bottom plate, x points to the nose, y to the
# left, z up. The frame's stack-up: bottom plate 0-3, arms 3-10, middle plate 10-13, the
# stack bay 13-32, top plate 32-35. Props spin at about z = 43-52.

materials:
  tpu:
    density_g_cm3: 1.21
    fill: 0.6
    note: TPU 95A, for parts that take hits (legs, the GPS mast mount). The fill is walls plus infill, as a share of solid
  petg_cf:
    density_g_cm3: 1.30
    fill: 0.5
    note: Carbon-filled PETG, stiff and light, for brackets, the tray and the rail
  carbon:
    density_g_cm3: 1.6
    fill: 1.0
    note: Carbon fiber plate and tube, solid

print:
  min_wall_mm: 1.2 # three 0.4 mm perimeters, the thinnest wall worth printing

checks: # from the spec's "check numbers"
  max_motor_overload: 0.05 # in a hover, no motor works more than 5% harder than the average
  rigid_clearance_mm: 10 # props flex and motors vibrate
  moving_clearance_mm: 20 # antennas, wires and straps can swing
  chute_cone_half_angle_deg: 30
  chute_cone_height_mm: 500
  compass_from_power_mm: 100 # Matek: keep the compass 10 cm from power wires, the ESC and motors
  remote_id_from_gps_mm: 100 # Ruko says "away from the GPS"; 10 cm is my reading of that
  compass_part: ark-gps # the GPS carries the compass
  remote_id_part: ruko-r111

pack:
  tray_max_length_mm: 150 # the pack hangs under the body, between the legs
  tray_max_width_mm: 90
  x_mm: 10 # the pack's center, before trimming
  slide_mm: 30 # how far it can slide either way to trim the balance
  tray_thickness_mm: 3

legs:
  spots_mm: [[45, 45], [45, -45], [-45, 45], [-45, -45]] # under the arms, outside the pack
  diameter_mm: 12
  below_pack_mm: 20 # the legs reach this far below the pack, so the pack never lands
  material: tpu

rail: # the module rail on the top plate, carrying V and P
  from_x_mm: -50
  to_x_mm: 66
  width_mm: 30
  height_mm: 6
  material: petg_cf

gps_mast:
  at_mm: [-58, 0] # on the top plate, behind the V housing
  height_mm: 90
  tube_diameter_mm: 8
  mount_size_mm: 14 # the printed TPU block the tube plugs into
  material: carbon

v_housing: # an envelope around the Pi 5 stack, until the modules step designs it
  from_x_mm: -50
  to_x_mm: 12 # 58 mm inside, for the 56.5 mm HaLow HAT
  width_mm: 92
  height_mm: 69
  wall_mm: 2
  material: petg_cf

p_holder: # a cradle around the Harrier tube's base
  height_mm: 30
  wall_mm: 2
  material: petg_cf

# Where each bought part sits: its own origin (centered, sitting on z = 0) moved to at_mm,
# after turning by turn_deg about x, then y, then z.
place:
  holybro-tekko32-f4-50a: {at_mm: [0, 0, 13.9]} # on the middle plate, its underside parts at 13.0
  ark-fpv: {at_mm: [0, 0, 20.4]} # stacked on the ESC; its top at 27, under the 32 mm top plate
  radiomaster-rp2-v2: {at_mm: [-56, 0, 13]} # at the rear edge of the bay, its ceramic antenna at the back
  matek-bec12s-pro: {at_mm: [-36.5, 0, 13], turn_deg: [0, 0, 90]} # in the bay behind the ESC; the module connector carries its 5 V
  pjrc-teensy-41: {at_mm: [62, 0, 17.5]} # in front of the stack, on its printed carrier
  adafruit-lsm6dsox: {at_mm: [110, 0, 13]} # the safety monitor's IMU, ahead of the Teensy
  cjmcu-5018: {at_mm: [63, 0, 22.14]} # the motor cut switch, on the Teensy
  safety-monitor-buffers: {at_mm: [90, 0, 22.14]} # on the Teensy's front half
  bat54c-on-adapter: {at_mm: [43, 0, 22.14]}
  pololu-d36v6f3@base: {at_mm: [63, 0, 26.14]} # on the switch board, under the top plate
  module-socket: # one per slot: V's and P's sunk into the rail, C's off the frame's back edge
    - {at_mm: [-5, 0, 35]}
    - {at_mm: [38, 0, 35]}
    - {at_mm: [-70, 15, 3]}
  branch-fuses: # two holders hanging off the back edge, beside the battery leads
    - {at_mm: [-74, -14, 3]}
    - {at_mm: [-98, -14, 3]}
  ruko-r111: {at_mm: [86.5, 0, 35]} # on the front of the top plate, away from the GPS and the belly
  benewake-tf-luna: {at_mm: [135, 0, -3], turn_deg: [180, 0, 0]} # under the nose, looking down
  rpi-camera-module-3: {at_mm: [162, 0, 17.5], turn_deg: [0, 90, 0]} # in front of the plates, looking forward
  ark-gps: {at_mm: [-58, 0, 125]} # on top of the GPS mast, overhanging its plate
  module-plug@V: {at_mm: [-5, 0, 41]} # through the V housing's floor, under the Pi
  rpi-5-4gb: {at_mm: [-19, 0, 51], turn_deg: [0, 0, 90]} # inside the V housing, its long side across, raised 6 mm for the module plug
  rpi-active-cooler: {at_mm: [-19, 0, 68.4], turn_deg: [0, 0, 90]} # drawn above the Pi's envelope, which is conservative
  heltec-ht-hc01p: {at_mm: [-19, 0, 90.6], turn_deg: [0, 0, 90]} # on a stacking header above the cooler
  halow-antenna-915: {at_mm: [-50, 35, 101], turn_deg: [0, -90, 0]} # out the back of the V housing, high and to the left
  fruity-chutes-harrier-40-42: {at_mm: [38, 0, 47]} # on its cradle's lip, 6 mm above the rail for the module plug
  module-plug@P: {at_mm: [38, 0, 41]} # under the Harrier tube, inside the cradle
  ark-cannode@P: {at_mm: [38, 39.1, 59], turn_deg: [90, 0, 0]} # strapped to the cradle's side
  p-chute-switch: {at_mm: [38, -30.6, 44]} # the other side of the cradle
  pololu-d36v6f3@P: {at_mm: [38, -31.2, 47]}
  p-servo-diodes: {at_mm: [38, -30.1, 49.5]}
  claws-placeholder: {at_mm: [-125, 0, -53]} # behind the pack, far enough back to let it slide
  ark-cannode@C: {at_mm: [-125, 0, -3]} # on top of the claws
  module-plug@C: {at_mm: [-86, 15, 3]} # mated to C's socket from behind

# Rough wire routes: a tube about the thickness of each run's likely gauge, through these
# points. Step 3 picks the real gauges and connectors and sends back exact thicknesses.
# A wire belongs to Base unless it says otherwise, and only shows up when its module is on.
wires:
  - name: battery leads
    diameter_mm: 8 # two 12 AWG leads side by side
    path_mm: [[30, 0, -5], [-60, 0, -5], [-70, 0, 5], [-70, 0, 16], [-26, 0, 16]]
  - name: motor leads front left
    diameter_mm: 5 # three 18 AWG
    path_mm: [[20, 15, 16], [30, 30, 12], [130, 130, 12], [146, 146, 12]]
  - name: motor leads front right
    diameter_mm: 5
    path_mm: [[20, -15, 16], [30, -30, 12], [130, -130, 12], [146, -146, 12]]
  - name: motor leads back left
    diameter_mm: 5
    path_mm: [[-20, 15, 16], [-30, 30, 12], [-130, 130, 12], [-146, 146, 12]]
  - name: motor leads back right
    diameter_mm: 5
    path_mm: [[-20, -15, 16], [-30, -30, 12], [-130, -130, 12], [-146, -146, 12]]
  - name: receiver
    diameter_mm: 3
    path_mm: [[-10, 0, 25], [-50, 0, 18]]
  - name: gps
    module: V
    diameter_mm: 3
    path_mm: [[-10, 5, 28], [-55, 5, 30], [-55, 5, 40], [-55, 5, 122]]
  - name: lidar
    diameter_mm: 3
    path_mm: [[10, 0, 24], [118, 8, 16], [140, 8, 8], [140, 8, -6]]
  - name: safety monitor
    diameter_mm: 3
    path_mm: [[15, 0, 26], [35, 0, 24]]
  - name: bec feed
    diameter_mm: 3
    path_mm: [[-70, 6, 10], [-60, 6, 16], [-49, 6, 16]]
  - name: module connector
    diameter_mm: 4
    path_mm: [[-5, 0, 28], [-5, 0, 35]]
  - name: camera cable
    module: V
    diameter_mm: 3
    path_mm: [[158, 0, 17.5], [150, 0, 38], [12, 0, 44], [-5, 0, 52]]
  - name: chute servo
    module: P
    diameter_mm: 3
    path_mm: [[0, 8, 29], [8, 8, 38], [11, 0, 44]]
