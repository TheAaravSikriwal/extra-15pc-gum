# Researched 2026-10-19. In module P: the release servo's supply, from the module supply or, if
# that's gone, the CAN bus's 5 V, whichever is higher. An ideal-diode OR in place of the two
# 1N5817 Schottkys, which dropped the servo under its range (decided 2026-10-19).
