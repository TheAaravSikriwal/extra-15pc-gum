        - {name: VIN, role: power, volts: 3.3, max_volts: 5.5}
        - {name: 3Vo, role: power, volts: 3.3}
        - {name: GND, role: ground}
        - {name: SCK, role: signal, direction: in, volts: 3.3, functions: [SPI clock, I2C SCL]}
        - {name: MOSI, role: signal, direction: in, volts: 3.3, functions: [SPI data in, I2C SDA]}
        - {name: MISO, role: signal, direction: out, volts: 3.3, functions: [SPI data out]}
        - {name: CS, role: signal, direction: in, volts: 3.3, functions: [SPI chip select]}
        - {name: INT1, role: signal, direction: out, volts: 3.3}
        - {name: INT2, role: signal, direction: out, volts: 3.3}
