# Researched 2026-10-18. The safety monitor's own IMU. The ICM-42688-P first pencilled in has
# no breakout worth using (one out of stock, one discontinued, one $88 with no specs), so it's
# ST's LSM6DSOX on Adafruit's board.
type: component
id: adafruit-lsm6dsox
maker: Adafruit (board), STMicroelectronics (chip)
model: LSM6DSOX 6-DoF accelerometer and gyroscope breakout (product 4438)
price_usd: 11.95
checked: 2026-10-21
fallback: {"maker": "Adafruit", "model": "LSM6DSO32 breakout (4692)", "note": "the same family; its accelerometer has no +-2 g range, so the monitor's range setting changes", "link": "https://www.adafruit.com/product/4692", "price_usd": 12.5}
link: 'https://www.adafruit.com/product/4438'
source: {kind: manufacturer, url: 'https://www.adafruit.com/product/4438', checked: 2026-10-18, note: "Adafruit: 1.7 g, 25.6 x 17.8 x 4.6 mm, SPI or I2C, a regulator good for at least 250 mA and level-shifted inputs, so it runs from 3 V or 5 V. $11.95, in stock"}
mass_g: 1.7
power_w: 0.05
power_source: {kind: estimate, checked: 2026-10-18, note: "The sensor itself takes well under a milliamp; the board's power LED and regulator bring it to about 10 mA at 5 V, a guess"}
cad:
  shape: box
  length_mm: 25.6
  width_mm: 17.8
  height_mm: 4.6
  source: {kind: manufacturer, url: 'https://www.adafruit.com/product/4438', checked: '2026-10-18', note: "25.6 x 17.8 x 4.6 mm"}
  existing: {found: none, checked: '2026-10-18', note: "Adafruit's CAD parts repo (MIT, https://github.com/adafruit/Adafruit_CAD_Parts) has its other LSM6DSOX boards (4517, 4565) but not 4438"}
  connectors:
  - name: J1
    side: top
    faces: 'up'
    pins: {"VIN": [-10.16, -6.35], "3Vo": [-7.62, -6.35], "GND": [-5.08, -6.35], "SCK": [-2.54, -6.35], "MOSI": [0, -6.35], "MISO": [2.54, -6.35], "CS": [5.08, -6.35], "INT1": [7.62, -6.35], "INT2": [10.16, -6.35]}
    source: {"kind": "manufacturer", "url": "https://github.com/adafruit/Adafruit-LSM6DSOX-PCB", "checked": "2026-10-21", "note": "From Adafruit's PCB file, turned a quarter turn so the board's long side runs along x like the CAD's. The pins Adafruit labels SCL, SDA and DO are SCK, MOSI and MISO in SPI"}
electrical:
  source: {kind: manufacturer, url: 'https://www.adafruit.com/product/4438', checked: 2026-10-18, note: "Adafruit's board: VIN through its own regulator, level-shifted inputs, SPI or I2C, two interrupt pins"}
  estimates: ['connectors[J1]', 'draws[J1.VIN]']
  estimate_note: "The pin list follows Adafruit's usual breakout layout (VIN, 3Vo, GND, SCL/SCK, SDA/MOSI, DO/MISO, CS, INT1, INT2); the product page only names some of them. The draw and its 3 to 5.5 V range are guesses"
  connectors:
