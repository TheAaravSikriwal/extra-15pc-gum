# Researched 2026-10-18 for the electrical plan, which picked it to replace the Matek M10Q.
type: component
id: ark-gps
maker: ARK Electronics
model: ARK GPS (DroneCAN, u-blox NEO-M9N, BMM150 compass, BMP388 barometer)
price_usd: 225.0
checked: 2026-10-21
fallback: {"maker": "Holybro", "model": "DroneCAN M9N GPS (SKU 12032)", "note": "the same M9N and DroneCAN, but 20 g heavier, a different shape for the cradle, and one CAN port", "link": "https://holybro.com/products/dronecan-m9n-gps", "price_usd": 77.99}
link: 'https://arkelectron.com/product/ark-gps/'
source: {kind: manufacturer, url: 'https://docs.arkelectron.com/products/gps/ark-gps/hardware.md', checked: 2026-10-18, note: "ARK's hardware page: 5 x 5 x 1 cm, 16 g (neither says whether the case is included), two CAN plugs and a debug plug. $225 and in stock on ARK's shop (https://arkelectron.com/product/ark-gps/). It won't boot unless the flight controller has an SD card in it"}
mass_g: 16
power_w: 0.55
power_source: {kind: manufacturer, url: 'https://docs.arkelectron.com/products/gps/ark-gps/hardware.md', checked: 2026-10-18, note: "5 V, 110 mA average, 117 mA most"}
cad:
  shape: box
  length_mm: 50
  width_mm: 50
  height_mm: 10
  source:
    kind: manufacturer
    url: https://docs.arkelectron.com/products/gps/ark-gps/hardware.md
    checked: '2026-10-18'
    note: 5 x 5 x 1 cm. ARK says to point the connectors at the back of the vehicle, and publishes no mounting holes
  existing:
    found: official
    url: https://github.com/ARK-Electronics/ark-hardware/tree/main/ARK_GPS
    format: STEP (Rev 3) and case STLs
    terms: BSD-3-Clause (the folder's LICENSE file)
    checked: '2026-10-18'
  connectors:
  - name: CAN1
    side: bottom
    faces: '-x'
    pins: {"5V": [-22.08, 2.85], "CAN_P": [-21.82, 4.07], "CAN_N": [-21.56, 5.29], "GND": [-21.3, 6.52]}
    source: {"kind": "manufacturer", "url": "https://github.com/ARK-Electronics/ark-hardware/tree/main/ARK_GPS", "checked": "2026-10-21", "note": "From ARK's Rev 3 STEP model, exact to the model. The board is a 50 mm disk, and both CAN plugs are turned 12 degrees to follow its edge. ARK's photos show Rev 2; the arrow and the pin 1 marks are read off those, assuming Rev 3 keeps them"}
  - name: CAN2
    side: bottom
    faces: '-x'
    pins: {"5V": [-21.3, -6.52], "CAN_P": [-21.56, -5.3], "CAN_N": [-21.82, -4.07], "GND": [-22.08, -2.85]}
    source: {"kind": "manufacturer", "url": "https://github.com/ARK-Electronics/ark-hardware/tree/main/ARK_GPS", "checked": "2026-10-21", "note": "From ARK's Rev 3 STEP model, exact to the model. The board is a 50 mm disk, and both CAN plugs are turned 12 degrees to follow its edge. ARK's photos show Rev 2; the arrow and the pin 1 marks are read off those, assuming Rev 3 keeps them"}
electrical:
  source: {kind: manufacturer, url: 'https://docs.arkelectron.com/products/gps/ark-gps/hardware.md', checked: 2026-10-18, note: "Both CAN plugs are the Pixhawk standard 4-pin JST-GH (5V, CAN_P, CAN_N, GND); the debug plug is a 6-pin JST-SH. Its terminator is built in and switched on with CANNODE_TERM=1 (https://docs.arkelectron.com/products/gps/ark-gps/firmware.md)"}
  estimates: ['draws[CAN1.5V]', 'outputs[CAN_THROUGH]']
  estimate_note: "ARK gives 5 V and no range, so 4.75 to 5.25 V is assumed. The second CAN plug passes the 5 V straight on to the next node; its limit is taken as the JST-GH contact's 1 A"
  connectors:
    - name: CAN1
      family: jst-gh
      pins:
        - {name: 5V, role: power, volts: 5.0}
        - {name: CAN_P, role: bus}
        - {name: CAN_N, role: bus}
        - {name: GND, role: ground}
    - name: CAN2
      family: jst-gh
      pins:
        - {name: 5V, role: power, volts: 5.0}
        - {name: CAN_P, role: bus}
        - {name: CAN_N, role: bus}
        - {name: GND, role: ground}
    - name: DEBUG
      family: jst-sh
      pins:
        - {name: 3V3, role: power, volts: 3.3}
        - {name: USART2_TX, role: signal, direction: out, volts: 3.3}
        - {name: USART2_RX, role: signal, direction: in, volts: 3.3}
        - {name: SWDIO, role: signal, direction: both, volts: 3.3}
        - {name: SWCLK, role: signal, direction: in, volts: 3.3}
        - {name: GND, role: ground}
  joined:
    - [CAN1.CAN_P, CAN2.CAN_P] # the two plugs are one bus on the board
    - [CAN1.CAN_N, CAN2.CAN_N]
  draws:
    - {pin: CAN1.5V, min_v: 4.75, max_v: 5.25, typical_a: 0.11, worst_a: 0.117}
  outputs:
    - {name: CAN_THROUGH, kind: through, fed_from: CAN1.5V, pins: [CAN2.5V], volts: 5.0, continuous_a: 1.0}
