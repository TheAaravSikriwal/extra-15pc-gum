electrical:
  source: {kind: manufacturer, url: 'https://www.ti.com/lit/ds/symlink/sn74lvc1g125.pdf', checked: 2026-10-18, note: "TI's SN74LVC1G125: 1.65 to 5.5 V, inputs take up to 5.5 V, Ioff of 10 uA at most with the supply off (so a powered-down buffer doesn't load the line it listens to), input thresholds 2.0 V high and 0.8 V low at 3 to 3.6 V, 3.7 ns delay, 10 uA supply current at most. SOT-23-5 pins: 1 OE (low enables), 2 A, 3 GND, 4 Y, 5 VCC. The quad SN74LVC125A was passed over because its datasheet specifies no Ioff"}
