    checked: '2026-10-18'
    note: 3.0 x 3.0 cm. ARK says 1.03 cm tall and PX4 says 1.3, so the taller one is used. No mounting holes published
  estimates: [height_mm]
  estimate_note: The taller of the two published heights
  existing:
    found: official
    url: https://github.com/ARK-Electronics/ark-hardware/tree/main/ARK_CANnode
    format: STEP
    terms: BSD-3-Clause (the folder's LICENSE file)
    checked: '2026-10-18'
  connectors:
  - name: CAN1
    side: top
    faces: '-x'
    pins: {"5V": [-12.6, -2.63], "CAN_P": [-12.6, -3.88], "CAN_N": [-12.6, -5.13], "GND": [-12.6, -6.38]}
    source: {"kind": "manufacturer", "url": "https://github.com/ARK-Electronics/ark-hardware/tree/main/ARK_CANnode", "checked": "2026-10-21", "note": "From ARK's Rev 1 STEP model; pin 1 from the silkscreen dots in ARK's photos"}
  - name: CAN2
    side: top
    faces: '-x'
    pins: {"5V": [-12.6, 6.38], "CAN_P": [-12.6, 5.13], "CAN_N": [-12.6, 3.88], "GND": [-12.6, 2.63]}
    source: {"kind": "manufacturer", "url": "https://github.com/ARK-Electronics/ark-hardware/tree/main/ARK_CANnode", "checked": "2026-10-21", "note": "From ARK's Rev 1 STEP model; pin 1 from the silkscreen dots in ARK's photos"}
  - name: PWM
    side: bottom
    faces: '+x'
    pins: {"PU": [12.6, 5.63], "PWM1": [12.6, 4.38], "PWM2": [12.6, 3.13], "PWM3": [12.6, 1.88], "PWM4": [12.6, 0.63], "PWM5": [12.6, -0.62], "PWM6": [12.6, -1.87], "PWM7": [12.6, -3.12], "PWM8": [12.6, -4.37], "GND": [12.6, -5.62]}
    source: {"kind": "manufacturer", "url": "https://github.com/ARK-Electronics/ark-hardware/tree/main/ARK_CANnode", "checked": "2026-10-21", "note": "From ARK's Rev 1 STEP model; pin 1 from the silkscreen dots in ARK's photos"}
electrical:
  source: {kind: manufacturer, url: 'https://docs.arkelectron.com/products/sensor/ark-cannode/hardware.md', checked: 2026-10-18, note: "ARK's pinouts: two 4-pin JST-GH CAN plugs; a 10-pin JST-GH PWM plug with pin 1 pulled up to 3.3 V through 1.5 kOhm, PWM1 to PWM8 at 3.3 V, and pin 10 ground (so no servo power on it, unlike the Pixhawk 4 plug ARK says it matches); I2C and UART plugs with 5 V out at 500 mA. Terminator built in, switched on with CANNODE_TERM=1 (https://docs.arkelectron.com/products/sensor/ark-cannode/firmware.md)"}
  estimates: ['draws[CAN1.5V]', 'outputs[CAN_THROUGH]']
  estimate_note: "The draw is a guess (40 mA typical, 80 mA worst) and so is the 4.75 to 5.25 V range. The second CAN plug passes 5 V on to the next node, limited here to the JST-GH contact's 1 A"
  connectors:
    - name: CAN1
      family: jst-gh
      pins:
        - {name: 5V, role: power, volts: 5.0}
        - {name: CAN_P, role: bus}
        - {name: CAN_N, role: bus}
        - {name: GND, role: ground}
    - name: CAN2
      family: jst-gh
      pins:
        - {name: 5V, role: power, volts: 5.0}
        - {name: CAN_P, role: bus}
        - {name: CAN_N, role: bus}
        - {name: GND, role: ground}
    - name: PWM
      family: jst-gh
      pins:
        - {name: PU, role: signal, direction: out, volts: 3.3, functions: [pulled up to 3.3 V through 1.5 kOhm]}
        - {name: PWM1, role: signal, direction: out, volts: 3.3, functions: [TIM2_CH1]}
        - {name: PWM2, role: signal, direction: out, volts: 3.3, functions: [TIM2_CH2]}
        - {name: PWM3, role: signal, direction: out, volts: 3.3, functions: [TIM2_CH3]}
        - {name: PWM4, role: signal, direction: out, volts: 3.3, functions: [TIM3_CH1]}
        - {name: PWM5, role: signal, direction: out, volts: 3.3, functions: [TIM3_CH2]}
        - {name: PWM6, role: signal, direction: out, volts: 3.3, functions: [TIM3_CH3]}
        - {name: PWM7, role: signal, direction: out, volts: 3.3, functions: [TIM3_CH4]}
        - {name: PWM8, role: signal, direction: out, volts: 3.3, functions: [TIM4_CH2]}
        - {name: GND, role: ground}
    - name: I2C
      family: jst-gh
      pins:
        - {name: 5V, role: power, volts: 5.0}
        - {name: SCL, role: signal, direction: both, volts: 3.3}
        - {name: SDA, role: signal, direction: both, volts: 3.3}
        - {name: GND, role: ground}
    - name: UART
      family: jst-gh
      pins:
        - {name: 5V, role: power, volts: 5.0}
        - {name: TX, role: signal, direction: out, volts: 3.3}
        - {name: RX, role: signal, direction: in, volts: 3.3}
        - {name: SCL, role: signal, direction: both, volts: 3.3}
        - {name: SDA, role: signal, direction: both, volts: 3.3}
        - {name: GND, role: ground}
  joined:
    - [CAN1.CAN_P, CAN2.CAN_P] # the two plugs are one bus on the board
    - [CAN1.CAN_N, CAN2.CAN_N]
  draws:
    - {pin: CAN1.5V, min_v: 4.75, max_v: 5.25, typical_a: 0.04, worst_a: 0.08}
  outputs:
    - {name: CAN_THROUGH, kind: through, fed_from: CAN1.5V, pins: [CAN2.5V], volts: 5.0, continuous_a: 1.0}
    - {name: 5V_OUT, kind: through, fed_from: CAN1.5V, pins: [I2C.5V, UART.5V], volts: 5.0, continuous_a: 0.5}
