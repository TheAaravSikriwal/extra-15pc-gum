[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pcs14"
version = "0.1.0"
description = "14 pcs left: the design and simulation tools for the Extra 15pc Gum drone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "build123d==0.13.0",
    "matplotlib==3.11.2",
    "pydantic==2.13.5",
    "pyulog==1.2.4",
    "pyyaml==6.0.3",
    "rerun-sdk==0.38.1",
    "wireviz==0.4.1",
]

[project.optional-dependencies]
# flying the flight sim, installed in WSL2 by scripts/setup-ubuntu.sh (MAVSDK's 3.x line: 4.0 was
# a month-old major version when it was pinned, 2026-10-19). Reading PX4's logs (pyulog) is in
# the main list, so any machine can grade, draw and replay flights already flown.
flight = [
    "mavsdk==3.17.4",
]

[project.scripts]
pcs14 = "pcs14.cli:main"

[dependency-groups]
dev = [
    "pyyaml>=6",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pcs14"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kicad: needs KiCad's command line (CI runs these in their own job)",
    "px4: flies PX4 in Gazebo (only inside WSL2 Ubuntu, after scripts/setup-ubuntu.sh)",
    "sitl: flies my own firmware in Gazebo (inside WSL2 Ubuntu, after scripts/build-firmware.sh)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
