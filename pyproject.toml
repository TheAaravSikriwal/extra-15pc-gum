[project]
name = "extra-15pc-gum"
version = "0.0.0"
description = "Sizing model and simulation tools for the Extra 15pc Gum drone"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pyyaml>=6",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
