[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pcs14"
version = "0.1.0"
description = "14 pcs left: the design and simulation tools for the Extra 15pc Gum drone"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "pydantic==2.13.5",
    "pyyaml==6.0.3",
    "rerun-sdk==0.38.1",
]

[project.scripts]
pcs14 = "pcs14.cli:main"

[dependency-groups]
dev = [
    "pyyaml>=6",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pcs14"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
