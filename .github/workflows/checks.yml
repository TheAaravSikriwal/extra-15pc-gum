name: checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends graphviz ngspice
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev -e .
      - run: ruff check .
      - run: pytest

  # KiCad is big, so its tests (the schematic's electrical rules check) get their own job.
  kicad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kicad
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev -e .
      - run: pytest -m kicad

  # My flight firmware's core: built with the sanitizers and tested on the host.
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyulog==1.2.4
      - run: cmake -S firmware -B build/firmware -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE="$(which python)"
      - run: cmake --build build/firmware -j 4
      - run: ctest --test-dir build/firmware --output-on-failure

  # My flight firmware for the ARK FPV's STM32H743: it has to build and link for the board.
  h743:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - run: cmake -S firmware -B build/h743 -DCMAKE_TOOLCHAIN_FILE="$PWD/firmware/cmake/arm-none-eabi.cmake" -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/h743 --target pcs14_h743 -j 4

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
